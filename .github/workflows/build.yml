name: Build SM64 3DS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sed -i '/^\[options\]/a XferCommand = /usr/bin/wget --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" --passive-ftp -c -O %o %u' /opt/devkitpro/pacman/etc/pacman.conf
          sed -i '/^\[dkp-libs\]/a SigLevel = Never' /opt/devkitpro/pacman/etc/pacman.conf
          sed -i '/^\[dkp-linux\]/a SigLevel = Never' /opt/devkitpro/pacman/etc/pacman.conf
          dkp-pacman -Sy --noconfirm 3ds-dev

      - name: Decode BaseROM
        env:
          ROM_BASE64: ${{ secrets.BASEROM_BASE64 }}
        run: |
          echo "$ROM_BASE64" | base64 -d > baserom.eu.z64

      - name: Build 3DS Executables
        shell: bash
        run: |
          source /etc/profile.d/devkit-env.sh
          make VERSION=eu BANNERTOOL=bannertool MAKEROM=makerom -j$(nproc)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SM64-3DS-Build
          path: |
            *.3dsx
            *.cia
