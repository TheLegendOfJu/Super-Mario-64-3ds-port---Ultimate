name: Build SM64 3DS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/3dsdev:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Decode BaseROM
        env:
          ROM_BASE64: ${{ secrets.BASEROM_BASE64 }}
        run: |
          echo "$ROM_BASE64" | base64 -d > baserom.eu.z64

      - name: Build 3DS Executables
        run: |
          source /etc/profile.d/devkit-env.sh
          make VERSION=eu -j$(nproc)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SM64-3DS-Build
          path: |
            *.3dsx
            *.cia
